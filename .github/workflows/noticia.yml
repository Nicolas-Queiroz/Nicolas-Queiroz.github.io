name: Gerar post de notícia (bot IA)

on:
  # Roda a cada 2 dias, às 12:00 UTC (~09:00 Brasília).
  schedule:
    - cron: "0 12 */2 * *"
  # Permite disparar manualmente na aba Actions do GitHub.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Rodar bot
        env:
          CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/gerar_post.py

      - name: Commit drafts se houver mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drafts/
          if git diff --staged --quiet; then
            echo "Nenhum draft novo para commitar."
          else
            git commit -m "bot: novo(s) draft(s) de notícia"
            git push
          fi
